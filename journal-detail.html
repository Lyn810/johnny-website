<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Johnny Leo | Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-white: #FFFFFF;
            --soft-black: #1A1A1A;
            --warm-gray: #F5F5F3;
            --mid-gray: #D4D4D4;
            --accent-gold: #C5A572;
            --text-gray: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: light !important;
            background-color: #FFFFFF !important;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: #FFFFFF;
            color: #1A1A1A;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--mid-gray);
        }

        .nav-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 1.8rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--soft-black);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--soft-black);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 3rem 2rem 4rem;
        }

        /* Back Button */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .back-button svg {
            width: 20px;
            height: 20px;
        }

        .back-button:hover {
            color: var(--accent-gold);
        }

        /* Article Header */
        .article-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .article-date {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .article-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        .article-subtitle {
            font-size: 1.1rem;
            color: var(--text-gray);
            line-height: 1.8;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Carousel */
        .carousel-container {
            overflow: hidden;
            position: relative;
            max-width: 100%;
            margin: 2rem -1.5rem;
            background: var(--warm-gray);
        }

        .carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .carousel-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            min-width: 100%;
            background: #F5F5F3;
        }

        .carousel-slide img {
            width: auto; 
            height: auto;
            max-height: 60vh;
            max-width: 100%;
            object-fit: contain;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--soft-black);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .carousel-nav:hover {
            background: var(--accent-gold);
            color: white;
        }

        .carousel-prev {
            left: 1rem;
        }

        .carousel-next {
            right: 1rem;
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.5rem 0;
        }

        .carousel-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--mid-gray);
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .carousel-indicator.active {
            background: var(--accent-gold);
            width: 30px;
            border-radius: 5px;
        }

        .carousel-counter {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 10;
        }

        /* Article Content */
        .article-content {
            max-width: 800px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 2;
            color: var(--soft-black);
        }

        .article-content p {
            margin-bottom: 1.5rem;
        }

        /* Footer */
        footer {
            background: var(--soft-black);
            color: white;
            padding: 3rem 2rem 1.5rem;
            margin-top: 4rem;
            text-align: center;
        }

        footer a {
            color: rgba(254, 254, 254, 0.7);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--accent-gold);
        }

        .footer-bottom {
            padding-top: 2rem;
            color: rgba(254, 254, 254, 0.5);
            font-size: 0.85rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .nav-container {
                padding: 1.5rem 1.5rem;
            }

            .main-content {
                padding: 2rem 1.5rem;
            }

            .article-title {
                font-size: 2rem;
            }

            .carousel-slide img {
                max-height: 60vh;
            }

            .carousel-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .carousel-prev {
                left: 0.5rem;
            }

            .carousel-next {
                right: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="home.html" class="logo">Johnny Leo</a>
            <ul class="nav-links">
                <li><a href="journal.html">JOURNAL</a></li>
                <li><a href="pieces.html">PIECES</a></li>
                <li><a href="series.html">SERIES</a></li>
                <li><a href="artist.html">ARTIST</a></li>
                <li><a href="inquiry.html">INQUIRY</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <a href="journal.html" class="back-button">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Journal
        </a>

        <article>
            <!-- Header -->
            <div class="article-header">
                <div class="article-date" id="articleDate">Loading...</div>
                <h1 class="article-title" id="articleTitle">Loading...</h1>
                <p class="article-subtitle" id="articleSubtitle"></p>
            </div>

            <!-- Carousel -->
            <div class="carousel-container" id="carouselContainer" style="display: none;">
                <div class="carousel">
                    <div class="carousel-track" id="carouselTrack"></div>
                    <button class="carousel-nav carousel-prev" onclick="moveCarousel(-1)">‹</button>
                    <button class="carousel-nav carousel-next" onclick="moveCarousel(1)">›</button>
                    <div class="carousel-counter">
                        <span id="currentSlide">1</span> / <span id="totalSlides">0</span>
                    </div>
                </div>
                <div class="carousel-indicators" id="carouselIndicators"></div>
            </div>

            <!-- Content -->
            <div class="article-content" id="articleContent"></div>
        </article>
    </main>

    <footer>
        <p><a href="mailto:johnny_bcool@hotmail.com">johnny_bcool@hotmail.com</a></p>
        <div class="footer-bottom">
            <p>© 2026 Johnny Leo. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 輪播變數
        let currentSlide = 0;
        let totalSlides = 0;

        // 從 URL 取得文章 ID
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // 載入文章
        async function loadArticle() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const article = data.journal.find(item => item.id === articleId);
                
                if (article) {
                    renderArticle(article);
                } else {
                    showError('Article not found');
                }
            } catch (error) {
                console.error('Error loading article:', error);
                showError('Error loading article');
            }
        }

        // 渲染文章
        function renderArticle(article) {
            // 標題和日期
            document.getElementById('articleDate').textContent = article.date || '';
            document.getElementById('articleTitle').textContent = article.title || 'Untitled';
            document.getElementById('articleSubtitle').textContent = article.excerpt || '';

            // 內容
            document.getElementById('articleContent').innerHTML = article.content || '';

            // 輪播圖片
            if (article.images && article.images.length > 0) {
                renderCarousel(article.images);
            }
        }

        // 渲染輪播
        function renderCarousel(images) {
            const container = document.getElementById('carouselContainer');
            const track = document.getElementById('carouselTrack');
            const indicators = document.getElementById('carouselIndicators');
            
            totalSlides = images.length;
            document.getElementById('totalSlides').textContent = totalSlides;

            // 生成輪播項目
            track.innerHTML = images.map(img => `
                <div class="carousel-slide">
                    <img src="${img}" alt="Gallery image" loading="lazy">
                </div>
            `).join('');

            // 生成指示器
            indicators.innerHTML = images.map((_, index) => `
                <button class="carousel-indicator ${index === 0 ? 'active' : ''}" 
                        onclick="goToSlide(${index})"></button>
            `).join('');

            // 顯示輪播
            container.style.display = 'block';
            updateCarousel();
        }

        // 移動輪播
        function moveCarousel(direction) {
            currentSlide += direction;
            if (currentSlide < 0) {
                currentSlide = totalSlides - 1;
            } else if (currentSlide >= totalSlides) {
                currentSlide = 0;
            }
            updateCarousel();
        }

        // 跳到指定slide
        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        // 更新輪播
        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            const indicators = document.querySelectorAll('.carousel-indicator');
            const currentSlideElement = document.getElementById('currentSlide');
            
            if (track) {
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
            }
            
            if (indicators) {
                indicators.forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === currentSlide);
                });
            }
            
            if (currentSlideElement) {
                currentSlideElement.textContent = currentSlide + 1;
            }
        }

        // 鍵盤控制
        document.addEventListener('keydown', (e) => {
            if (totalSlides > 0) {
                if (e.key === 'ArrowLeft') {
                    moveCarousel(-1);
                } else if (e.key === 'ArrowRight') {
                    moveCarousel(1);
                }
            }
        });

        // 錯誤處理
        function showError(message) {
            document.getElementById('articleTitle').textContent = message;
            document.getElementById('articleDate').textContent = '';
            document.getElementById('articleSubtitle').textContent = '';
        }

        // 頁面載入時執行
        document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>
</html>
